name: Release

# Runs only for real version tags: v1.0.0, v1.2.3, etc.
# The tag itself is what triggers it, so tagging locally and pushing is enough.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish a release for'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The tag must match package.json, or "the release says v1.2.0 but the app
      # is 1.1.0" becomes possible. Fail here instead.
      - name: Verify tag matches package version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "v$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test (render)
        run: npm run test:render

      - name: Build
        run: npm run build

      # Attach the raw static bundle so people can self-host or audit it.
      - name: Package static build
        run: |
          cd dist
          zip -r ../truth-or-swipe-${{ inputs.tag || github.ref_name }}-dist.zip . -x '*.map'
          cd ..

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          {
            echo "## What's here"
            echo
            echo "A static, client-only build. No backend, no accounts, no network calls."
            echo
            echo "**\`dist.zip\`** is the entire compiled app — unzip and serve it from any static host."
            echo
            echo "### Verify it yourself"
            echo
            echo '```bash'
            echo "unzip truth-or-swipe-${TAG}-dist.zip -d truth-or-swipe"
            echo "cd truth-or-swipe"
            echo "python3 -m http.server 8080   # then open http://localhost:8080"
            echo '```'
            echo
            echo "### Integrity"
            echo
            echo '```'
            echo "sha256sum truth-or-swipe-${TAG}-dist.zip"
            echo '```'
            echo
            echo "SHA-256 of the attached bundle:"
            echo
            echo '```'
            sha256sum "truth-or-swipe-${TAG}-dist.zip"
            echo '```'
            echo
            echo "### Asset"
            echo
            echo "- \`truth-or-swipe-${TAG}-dist.zip\` — production build (\`dist/\`)"
            echo
            echo "Licence: all rights reserved. See LICENSE in the repository."
          } > release-notes.md
          gh release create "$TAG" \
            --title "Truth or Swipe $TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            "truth-or-swipe-${TAG}-dist.zip"

      - name: Attach checksum file
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          sha256sum "truth-or-swipe-${TAG}-dist.zip" > "SHA256SUMS-${TAG}.txt"
          gh release upload "$TAG" "SHA256SUMS-${TAG}.txt" --clobber
